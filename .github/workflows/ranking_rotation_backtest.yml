name: Ranking / Rotation / IPO Backtest (NSE, point-in-time, 1/3/5/10y)

on:
  workflow_dispatch:
    inputs:
      years:
        description: "Longest window in years (runs 1/3/5/10 inside it)"
        required: true
        default: "10"
      max_tickers:
        description: "Cap on names DOWNLOADED. 0 = all (a cap takes an alphabetical slice)."
        required: true
        default: "0"
      top_n:
        description: "Point-in-time universe size by trailing turnover"
        required: true
        default: "1000"
      script:
        description: "main = 1/3/5/10y ranking variants; robustness = staggered starts/periods/random control; breadth = MA50 and TS>=60 breadth gates; breakout = live-portfolio test of preferring 52w/ATH breakouts in leader sub-industries; seed_ath = one-off all-time-high table for the scanner (same as the Seed All-Time Highs workflow); forensics = do the chart-prompt gates (anchor GO/VETO, pullback signature, shakeout, supply shelves, stops, exits) add to the trend filter; oversold = oversold bounce then a close back above the 50dma"
        required: true
        default: "main"
        type: choice
        options: [main, robustness, breadth, breakout, seed_ath, forensics, oversold]

jobs:
  ranking-rotation:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install scipy
      - name: Run ranking / rotation / IPO backtest
        if: github.event.inputs.script == 'main'
        run: |
          set -o pipefail
          python ranking_rotation_backtest.py \
            --years "${{ github.event.inputs.years }}" \
            --max-tickers "${{ github.event.inputs.max_tickers }}" \
            --top-n "${{ github.event.inputs.top_n }}" \
            2>&1 | tee ranking_rotation_output.txt
      - name: Run robustness check (staggered starts, periods, random control)
        if: github.event.inputs.script == 'robustness'
        run: |
          set -o pipefail
          python ranking_robustness_backtest.py \
            --max-tickers "${{ github.event.inputs.max_tickers }}" \
            --top-n "${{ github.event.inputs.top_n }}" \
            2>&1 | tee ranking_rotation_output.txt
      - name: Run breadth-gate backtest (MA50 and TS>=60 breadth)
        if: github.event.inputs.script == 'breadth'
        run: |
          set -o pipefail
          python breadth_gates_backtest.py \
            --max-tickers "${{ github.event.inputs.max_tickers }}" \
            --top-n "${{ github.event.inputs.top_n }}" \
            2>&1 | tee ranking_rotation_output.txt
      - name: Run breakout-preference portfolio test
        if: github.event.inputs.script == 'breakout'
        run: |
          set -o pipefail
          python breakout_portfolio_backtest.py \
            --max-tickers "${{ github.event.inputs.max_tickers }}" \
            2>&1 | tee breakout_portfolio_output.txt
      - name: Commit breakout-test results
        if: success() && github.event.inputs.script == 'breakout'
        run: |
          bash scripts/commit_and_push.sh "Breakout portfolio test results" analysis/breakout_portfolio_backtest.csv breakout_portfolio_output.txt
      - name: Seed all-time highs (fallback for the Seed All-Time Highs workflow)
        if: github.event.inputs.script == 'seed_ath'
        run: |
          set -o pipefail
          python seed_ath.py 2>&1 | tee ranking_rotation_output.txt
          bash scripts/commit_and_push.sh "Seed all-time-high table" data/ath_levels.csv
      - name: Run chart-prompt gate study (forensics)
        if: github.event.inputs.script == 'forensics'
        run: |
          set -o pipefail
          python forensics_gate_study.py --max-tickers "${{ github.event.inputs.max_tickers }}" 2>&1 | tee forensics_output.txt
      - name: Commit forensics results
        if: success() && github.event.inputs.script == 'forensics'
        run: |
          bash scripts/commit_and_push.sh "Chart-prompt gate study results" analysis/forensics_gate_study.csv analysis/forensics_gate_era.csv analysis/forensics_exit_study.csv forensics_output.txt
      - name: Run oversold-bounce -> MA50 cross study
        if: github.event.inputs.script == 'oversold'
        run: |
          set -o pipefail
          python oversold_reclaim_study.py --max-tickers "${{ github.event.inputs.max_tickers }}" 2>&1 | tee oversold_output.txt
      - name: Commit oversold-study results
        if: success() && github.event.inputs.script == 'oversold'
        run: |
          bash scripts/commit_and_push.sh "Oversold bounce to MA50 study results" analysis/oversold_reclaim_study.csv analysis/oversold_reclaim_era.csv analysis/oversold_reclaim_exits.csv oversold_output.txt
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ranking-rotation-backtest
          path: |
            analysis/ranking_rotation_backtest.csv
            analysis/ranking_robustness.csv
            analysis/breadth_gates_backtest.csv
            analysis/breakout_portfolio_backtest.csv
            ranking_rotation_output.txt
            breakout_portfolio_output.txt
            analysis/forensics_*.csv
            forensics_output.txt
            analysis/oversold_reclaim_*.csv
            oversold_output.txt
          retention-days: 30
