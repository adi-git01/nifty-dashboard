name: Breakout and Sub-Industry Study (NSE)

on:
  workflow_dispatch:

jobs:
  breakout-sector:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install scipy
      - name: Run study
        run: |
          set -o pipefail
          python breakout_sector_study.py 2>&1 | tee breakout_sector_output.txt
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: breakout-sector-study
          path: |
            analysis/breakout_sector_study.csv
            analysis/breakout_sector_recent.csv
            analysis/scanner_tags_study.csv
            breakout_sector_output.txt
          retention-days: 30
      - name: Commit results
        if: success()
        run: |
          bash scripts/commit_and_push.sh "Breakout and sub-industry study results" analysis/breakout_sector_study.csv analysis/breakout_sector_recent.csv analysis/scanner_tags_study.csv breakout_sector_output.txt
