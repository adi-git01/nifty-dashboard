name: Alpha Trend Engine

on:
  schedule:
    # Regular: 3:45 PM IST = 10:15 AM UTC (Mon-Fri) - After market close for proper EOD data
    - cron: '15 10 * * 1-5'
  workflow_dispatch:  # Allow manual trigger

jobs:
  run-trading-engine:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Crucial for git-auto-commit-action
    
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history required so git-auto-commit can push without non-fast-forward errors
      # ✅ FIX #1: Removed `ref: ${{ github.head_ref }}` — that's for PRs only.
      # On schedule triggers github.head_ref is empty, causing a broken checkout.

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        
    - name: "Step 1/5: Trading Engine (Cache + Sub-Industry Rotation)"
      # ✅ FIX #4: This used to be the ONLY step without continue-on-error,
      # despite being the one most exposed to Yahoo Finance flakiness (the
      # full 777-stock universe fetch). A single failed attempt here killed
      # the whole job — no commit, no alerts, nothing downstream ran — which
      # is how entire trading days went missing from the history (e.g.
      # 2026-07-09). yf_safe.py now retries transient failures inside each
      # Python call, but a longer-spaced shell-level retry catches outages
      # that outlast those short in-process backoffs, and continue-on-error
      # (matching every other step) means Steps 2-6 still run and commit
      # their own independently-fetched data even if this one ultimately
      # can't recover.
      continue-on-error: true
      run: |
        for attempt in 1 2; do
          echo "Trading Engine attempt $attempt/2..."
          python trading_engine.py --mode full && exit 0
          echo "Attempt $attempt failed."
          if [ "$attempt" -lt 2 ]; then
            echo "Waiting 3 minutes before retry (outlasts in-process yfinance backoff)..."
            sleep 180
          fi
        done
        echo "Trading Engine failed after 2 attempts — continuing to later steps with continue-on-error."
        exit 1

    - name: "Step 2/5: Turnaround Screener (Institutional Accumulation Radar)"
      continue-on-error: true  # Screener failure must not block portfolio engine or commit
      run: |
        python turnaround_screener.py

    - name: "Step 3/5: OptComp-V22 Portfolio Engine (Live Prices + Exits/Rebalance)"
      continue-on-error: true  # Portfolio engine failure must not block alerts or commit
      run: |
        python dna3_current_portfolio.py

    - name: "Step 4/5: DNA3 Morning Alert (Telegram + Email)"
      continue-on-error: true  # Alert failure must not block commit
      run: |
        python dna3_morning_alert.py
      # ✅ FIX #2: Portfolio snapshot is written in Step 3 (same run), so it
      #    is available here — but only if checkout succeeded (fix #1 above).

    - name: "Step 5/6: Position & Volume Alert Daemon (Stop-Loss / Volume Spikes)"
      # ✅ FIX #3: alert_daemon.py was never called by the workflow.
      # --force-volume bypasses the IST 4PM check (server runs UTC, check was always failing)
      run: |
        python alert_daemon.py --force-volume
      continue-on-error: true  # Don't let alert failures block the commit

    - name: "Step 6/7: Daily Signal Logger (Earnings Shock + Turnaround Catalyst)"
      run: |
        python run_daily_signals.py
      continue-on-error: true

    - name: "Step 7/7: Composite-RS Crossing Alerts (Telegram)"
      # Reads the master snapshot Step 1 just wrote — no Yahoo call, so this
      # cannot fail on a rate limit. If Step 1 failed, the snapshot is stale and
      # every alert's last_value already matches it, so nothing fires: a stale
      # run is silent rather than wrong.
      env:
        # Write the checked-out file only; the commit step below publishes it.
        # Without this the daemon would also push via the Contents API and race
        # with its own commit.
        REPO_STORE_DISABLED: "1"
      run: |
        python rs_alert_daemon.py
      continue-on-error: true

    - name: Commit State Changes (All Data Files)
      uses: stefanzweifel/git-auto-commit-action@v5
      continue-on-error: true  # Don't fail the job if nothing changed or push conflicts
      with:
        commit_message: "🤖 System: EOD Engine Run (Cache, Portfolio, Sub-Industries, Turnaround Radar, Alerts)"
        file_pattern: 'data/*.csv data/*.json data/cache/*.parquet positions.json'
        push_options: '--force-with-lease'  # Safely handle non-fast-forward errors


    - name: 🚨 Notify on Crash (Telegram & Email)
      if: failure()
      run: |
        python -c "
        import os, requests, smtplib
        from email.mime.text import MIMEText
        from email.mime.multipart import MIMEMultipart
        
        msg = '🚨 <b>CRITICAL PIPELINE FAILURE</b> 🚨\n\nThe Alpha Trend Engine crashed during the 3:30 PM run!\n\n<b>Reason:</b> Process exited with fatal code.\nPlease check the GitHub Actions logs immediately.'
        
        token = os.environ.get('TELEGRAM_TOKEN')
        chat_id = os.environ.get('TELEGRAM_CHAT_ID')
        if token and chat_id:
            try: requests.post(f'https://api.telegram.org/bot{token}/sendMessage', json={'chat_id': chat_id, 'text': msg, 'parse_mode': 'HTML'}, timeout=10)
            except: pass
            
        user = os.environ.get('GMAIL_ADDRESS')
        pwd = os.environ.get('GMAIL_APP_PASSWORD')
        if user and pwd:
            em = MIMEMultipart()
            em['From'] = user
            em['To'] = user
            em['Subject'] = '🚨 CRITICAL PIPELINE FAILURE 🚨'
            em.attach(MIMEText(msg.replace('\n', '<br>'), 'html'))
            try:
                server = smtplib.SMTP('smtp.gmail.com', 587)
                server.starttls()
                server.login(user, pwd)
                server.send_message(em)
                server.quit()
            except: pass
        "
