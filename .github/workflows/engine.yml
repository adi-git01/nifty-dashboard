name: Alpha Trend Engine

on:
  schedule:
    # Regular: 3:45 PM IST = 10:15 AM UTC (Mon-Fri) - After market close for proper EOD data
    - cron: '15 10 * * 1-5'
    # GitHub starts scheduled runs late at peak UTC hours, so a handful of evening IST slots
    # give scripts/engine_gate.py another chance if the 15:45 IST run is skipped or delayed.
    - cron: '47 11 * * 1-5'
    - cron: '37 13 * * 1-5'
    - cron: '53 15 * * 1-5'
    - cron: '41 17 * * 1-5'
  workflow_dispatch:  # Allow manual trigger

# serialize repo data commits across workflows (engine, fundamentals, nse_prices, etc.)
concurrency:
  group: repo-data-write
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.c.outputs.skip }}
    steps:
    - uses: actions/checkout@v4
      with:
        sparse-checkout: |
          data/engine_last_run.json
          scripts/engine_gate.py
        sparse-checkout-cone-mode: false
    - id: c
      run: python3 scripts/engine_gate.py check

  run-trading-engine:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Crucial for git-auto-commit-action
    
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # every step queues its Telegram message here; "Send the evening brief" sends them as one (scripts/send_brief.py)
      TELEGRAM_BATCH: /tmp/telegram_batch.jsonl
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history required so git-auto-commit can push without non-fast-forward errors
      # ✅ FIX #1: Removed `ref: ${{ github.head_ref }}` — that's for PRs only.
      # On schedule triggers github.head_ref is empty, causing a broken checkout.

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Run EOD Pipeline (single-process orchestrator)
      # Runs log hygiene, NSE daily feed, trading engine (2 attempts), model portfolio,
      # heartbeat, alerts, RS divergence & daily signals (retiring nightly IAS/TC),
      # valuation snapshot, alert daemons, and safe snapshot pruning.
      continue-on-error: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_BRANCH: ${{ github.ref_name }}
      run: |
        python scripts/eod_pipeline.py

    - name: Send the evening brief (one Telegram message for the whole run)
      if: always()
      continue-on-error: true
      env:
        TELEGRAM_BATCH: ""
      run: |
        python scripts/send_brief.py /tmp/telegram_batch.jsonl

    - name: Mark today's run (later schedules skip)
      run: |
        # records the session the snapshot holds; later firings skip only once that is today's (scripts/engine_gate.py)
        python scripts/engine_gate.py mark

    - name: Commit State Changes (All Data Files)
      # Rebase-and-retry instead of a force push, which overwrote commits that
      # landed during the run (see scripts/commit_and_push.sh).
      run: >
        bash scripts/commit_and_push.sh
        "🤖 System: EOD Engine Run (Cache, Portfolio, Sub-Industries, Signals, Alerts)"
        'data/*.csv' 'data/*.json' 'data/*.parquet' 'data/cache/*.parquet' 'data/nse/*' positions.json


    - name: Data health check (fails the run if today's snapshot is missing)
      # Runs after the commit so good data is saved either way. Not continue-on-error:
      # a failure here turns the run red and fires the crash notification below.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_BRANCH: ${{ github.ref_name }}
        TELEGRAM_BATCH: ""          # after the brief: a failure is sent at once
      run: |
        python scripts/health_check.py

    - name: 🚨 Notify on Crash (Telegram & Email)
      if: failure()
      run: |
        python -c "
        import os, requests, smtplib
        from email.mime.text import MIMEText
        from email.mime.multipart import MIMEMultipart
        
        msg = '🚨 <b>CRITICAL PIPELINE FAILURE</b> 🚨\n\nThe Alpha Trend Engine crashed during the 3:30 PM run!\n\n<b>Reason:</b> Process exited with fatal code.\nPlease check the GitHub Actions logs immediately.'
        
        token = os.environ.get('TELEGRAM_TOKEN')
        chat_id = os.environ.get('TELEGRAM_CHAT_ID')
        if token and chat_id:
            try: requests.post(f'https://api.telegram.org/bot{token}/sendMessage', json={'chat_id': chat_id, 'text': msg, 'parse_mode': 'HTML'}, timeout=10)
            except: pass
            
        user = os.environ.get('GMAIL_ADDRESS')
        pwd = os.environ.get('GMAIL_APP_PASSWORD')
        if user and pwd:
            em = MIMEMultipart()
            em['From'] = user
            em['To'] = user
            em['Subject'] = '🚨 CRITICAL PIPELINE FAILURE 🚨'
            em.attach(MIMEText(msg.replace('\n', '<br>'), 'html'))
            try:
                server = smtplib.SMTP('smtp.gmail.com', 587)
                server.starttls()
                server.login(user, pwd)
                server.send_message(em)
                server.quit()
            except: pass
        "
