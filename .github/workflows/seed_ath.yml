name: Seed All-Time Highs (one-off)

on:
  workflow_dispatch:

jobs:
  seed-ath:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download full history and write data/ath_levels.csv
        run: |
          set -o pipefail
          python seed_ath.py 2>&1 | tee seed_ath_output.txt
      - name: Commit
        if: success()
        run: |
          bash scripts/commit_and_push.sh "Seed all-time-high table" data/ath_levels.csv
