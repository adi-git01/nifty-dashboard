name: Momentum Factor Backtest (Nifty 500, 1/3/5/10y)

# Manual only. Heavy research run — results upload as an artifact and are never
# committed, so it cannot disturb the live data files.
on:
  workflow_dispatch:
    inputs:
      years:
        description: "Lookback in years (10 covers COVID + the 2022 bear)."
        required: true
        default: "10"
      max_tickers:
        description: "Universe cap (0 or 500 = all Nifty 500)."
        required: true
        default: "500"

jobs:
  factor-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install scipy
      - name: Run factor backtest
        run: |
          python momentum_factor_backtest.py \
            --years "${{ github.event.inputs.years }}" \
            --max-tickers "${{ github.event.inputs.max_tickers }}" \
            2>&1 | tee factor_backtest_output.txt
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: momentum-factor-backtest
          path: |
            analysis/factor_*.csv
            factor_backtest_output.txt
          retention-days: 30
