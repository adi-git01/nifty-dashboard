name: Quarterly Nifty 1000 Universe Refresh

on:
  schedule:
    # Quarterly: 1st of Jan, Apr, Jul, Oct at 10 PM IST (4:30 PM UTC)
    - cron: '30 16 1 1 *'
    - cron: '30 16 1 4 *'
    - cron: '30 16 1 7 *'
    - cron: '30 16 1 10 *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  refresh-universe:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Refresh Nifty 1000 universe
      run: python build_nifty1000_ci.py
      # Uses market cap ranking (faster than OHLCV) — ~15 min for 1000 stocks

    - name: Commit updated universe
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "🤖 System: Quarterly Nifty 1000 universe refresh (top 1000 by market cap)"
        file_pattern: 'data/nifty1000_list.csv'
        push_options: '--force-with-lease'

    - name: Notify on failure
      if: failure()
      run: |
        python -c "
        import os, requests
        token   = os.environ.get('TELEGRAM_TOKEN')
        chat_id = os.environ.get('TELEGRAM_CHAT_ID')
        if token and chat_id:
            msg = '⚠️ <b>Nifty 1000 Universe Refresh Failed</b>\nThe quarterly stock universe refresh did not complete. Dashboard will continue using the previous list.'
            try:
                requests.post(f'https://api.telegram.org/bot{token}/sendMessage',
                              json={'chat_id': chat_id, 'text': msg, 'parse_mode': 'HTML'}, timeout=10)
            except: pass
        "
