name: Winner EPS Trajectory (doubles vs losers)

on:
  workflow_dispatch:
    inputs:
      years:
        description: "Lookback in years."
        required: true
        default: "10"
      max_tickers:
        description: "Cap on names DOWNLOADED. 0 = all ~2110."
        required: true
        default: "0"

jobs:
  winner-eps:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10", cache: pip }
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install scipy
      - name: Run winner EPS trajectory test
        run: |
          python winner_eps_backtest.py \
            --years "${{ github.event.inputs.years }}" \
            --max-tickers "${{ github.event.inputs.max_tickers }}" \
            2>&1 | tee winner_eps_output.txt
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winner-eps
          path: |
            analysis/winner_eps.csv
            winner_eps_output.txt
          retention-days: 30
